services:
  wordpress:
    image: wordpress:php8.3-apache@sha256:f3e6835fa7d4a5b786615c24b67ec70816e06ebd517d31276bef423e49dfd126
    restart: unless-stopped
    depends_on:
      - db
    networks:
      default:
      proxy:
        aliases:
          - "${WORDPRESS_PROXY_ALIAS:-wordpress}"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - "${WORDPRESS_HTML_DIR:-${HOST_DATA_DIR:-./data}/html}:/var/www/html"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${WORDPRESS_DB_NAME:-wordpress}"
      WORDPRESS_DB_USER: "${WORDPRESS_DB_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${WORDPRESS_DB_PASSWORD:?固有のパスワードを設定してください}"
      TZ: "${TZ:-Asia/Tokyo}"

  db:
    image: mariadb:11
    restart: unless-stopped
    networks:
      - default
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-33060}:3306"
    volumes:
      - "${WORDPRESS_DB_DIR:-${HOST_DATA_DIR:-./data}/db_data}:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?固有のパスワードを設定してください}"
      MYSQL_DATABASE: "${WORDPRESS_DB_NAME:-wordpress}"
      MYSQL_USER: "${WORDPRESS_DB_USER:-wordpress}"
      MYSQL_PASSWORD: "${WORDPRESS_DB_PASSWORD:?固有のパスワードを設定してください}"
      TZ: "${TZ:-Asia/Tokyo}"

networks:
  default:
  proxy:
    external: true
    name: "${PROXY_NETWORK_NAME:-proxy-network}"
